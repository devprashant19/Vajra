[project]
name = "vajra-core"
version = "0.1.0"
description = "Core abstractions and schemas for Vajra"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "h3>=3.7.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "confluent-kafka>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
]
