[project]
name = "vajra"
version = "0.1.0"
description = "Vajra real-time convective-scale nowcasting platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3",
    "cdsapi>=0.7.7",
    "duckdb>=1.5.6",
    "fsspec>=2026.9.0",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "pyarrow>=25.0.1",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.3",
    "s3fs>=2026.9.0",
    "tabulate>=0.10.0",
    "tenacity>=9.1.4",
    "zarr>=3.4.0",
]

[tool.pytest.ini_options]
markers = [
    "unit",
    "integration",
    "live",
    "gpu",
    "slow",
    "bench"
]
testpaths = [
    "tests",
    "packages",
    "services",
    "ml"
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*"
]

[dependency-groups]
dev = [
    "confluent-kafka>=2.15.1",
    "geoalchemy2>=0.20.0",
    "hypothesis>=6.168.3",
    "minio>=7.2.20",
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyproj>=3.8.0",
    "pytest-cov>=7.1.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.1",
    "types-jsonschema>=4.26.0.20260518",
]
